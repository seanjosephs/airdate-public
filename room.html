<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>airdate</title>
  <link rel="icon" href="/static/brand/airdate-icon-256.png" type="image/png">
  <link rel="stylesheet" href="/static/room/tokens.css?v=2">
  <link rel="stylesheet" href="/static/room/room.css?v=2">
  <link rel="stylesheet" href="/static/room/cards.css?v=1">
  <script src="/static/room/api.js?v=1" defer></script>
  <script src="/static/room/cards.js?v=1" defer></script>
  <script src="/static/room/keys.js?v=1" defer></script>
  <script src="/static/room/pool.js?v=1" defer></script>
</head>
<body>
  <a class="skip-link" href="#room-main">skip to the essays</a>

  <aside class="room-sidebar">
    <a class="room-brand" href="/airdate/room">
      <img src="/static/brand/airdate-sign-600.webp" alt="airdate" width="600" height="186">
    </a>

    <nav class="room-nav" aria-label="main">
      <a href="/airdate/room" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M6 3h9l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
          <path d="M14 3v6h6"/><path d="M9 13h7"/><path d="M9 17h5"/>
        </svg>
        essays
      </a>
      <a href="/airdate/room#shelf">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 7h18"/><path d="M3 13h18"/><path d="M3 19h18"/>
          <path d="M7 4v3"/><path d="M13 10v3"/><path d="M9 16v3"/>
        </svg>
        the shelf
      </a>
      <a href="/airdate/room#rainy-day">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 3a8 8 0 0 1 8 8H4a8 8 0 0 1 8-8z"/>
          <path d="M12 11v7a2 2 0 0 0 4 0"/>
        </svg>
        rainy day
      </a>
      <a href="/airdate/room#settings">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
        </svg>
        settings
      </a>
    </nav>
  </aside>

  <main class="room-main" id="room-main" tabindex="-1">
    <section class="pool" aria-labelledby="pool-heading">
      <div class="pool-head">
        <div class="pool-title-row">
          <h1 id="pool-heading">essays</h1>
          <span class="pool-count-pill"><span id="pool-count">0</span><span class="visually-hidden"> shown</span></span>
          <span class="pool-grow"></span>
          <div class="pool-search">
            <label for="pool-search" class="visually-hidden">search essays</label>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
            <input id="pool-search" type="search" placeholder="search essays" autocomplete="off" spellcheck="false">
          </div>
        </div>

        <div class="pool-filters">
          <div class="pool-phases" role="group" aria-label="phase">
            <button type="button" class="pool-pill" data-phase="all" aria-pressed="true">all</button>
            <button type="button" class="pool-pill pool-pill-room" data-phase="writers-room" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false"><path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/></svg>
              writers room
            </button>
            <button type="button" class="pool-pill pool-pill-likey" data-phase="writers-likey" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>
              writers likey
            </button>
            <button type="button" class="pool-pill pool-pill-ready" data-phase="ready-for-air" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="2"/><path d="M7.5 7.5a6.5 6.5 0 0 0 0 9M16.5 7.5a6.5 6.5 0 0 1 0 9M4.5 4.5a10.5 10.5 0 0 0 0 15M19.5 4.5a10.5 10.5 0 0 1 0 15"/></svg>
              ready for air
            </button>
          </div>
          <span class="pool-divider" id="pool-totem-divider" aria-hidden="true"></span>
          <div class="pool-totems" id="pool-totems" role="group" aria-label="totem"></div>
          <button type="button" class="pool-pill pool-star" id="pool-star" aria-pressed="false">
            <svg viewBox="0 0 40 40" width="18" height="18" aria-hidden="true" focusable="false"><path d="M20 4.5 L24.6 15.2 L36.5 16 L27.4 23.8 L30.6 35.5 L20 29 L9.8 35.8 L12.8 23.6 L3.5 16.4 L15.3 15.3 Z"/></svg>
            writers likey &middot; <span id="pool-likey-count">0</span>
          </button>
          <span class="pool-grow"></span>
          <div class="pool-sort">
            <label for="pool-sort">sort</label>
            <select id="pool-sort">
              <option value="closest-to-air">closest to air</option>
            </select>
          </div>
        </div>
        <p class="visually-hidden" id="pool-results" role="status"></p>
      </div>

      <div class="pool-columns" id="pool"></div>
    </section>
  </main>
</body>
</html>
